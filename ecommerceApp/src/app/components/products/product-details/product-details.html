<div class="container my-5" *ngIf="!loading() && !error() && product()">
  <div class="row">
    <div class="col-md-6 mb-4 mb-md-0">
      <div class="product-image-container border rounded shadow-sm p-3 bg-white">
        <img [src]="product().image" class="img-fluid main-product-image" [alt]="product().name">
      </div>
    </div>

    <div class="col-md-6">
      <div class="product-info ps-md-4">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a routerLink="/products">Products</a></li>
            <li class="breadcrumb-item active">{{product().category}}</li>
          </ol>
        </nav>

        <h1 class="display-5 fw-bold mb-3">{{product().name}}</h1> <p class="text-muted mb-4 fs-5">{{product().description}}</p>

        <div class="mb-4">
          <span class="h2 fw-bold text-dark">${{product().price | number:'1.2-2'}}</span>
        </div>

        <div class="mb-4">
          <div *ngIf="product().stock > 0" class="badge bg-light text-success p-2 border border-success">
            <i class="bi bi-check-circle-fill"></i> In Stock: {{product().stock}} units
          </div>
          <div *ngIf="product().stock <= 0" class="badge bg-light text-danger p-2 border border-danger">
            <i class="bi bi-x-circle-fill"></i> Out of Stock
          </div>
        </div>

        <div class="d-grid mt-5">
          <button class="btn btn-dark btn-lg py-3" 
                  (click)="addToCart()" 
                  [disabled]="product().stock <= 0">
            Add to Cart
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div *ngIf="loading()" class="text-center py-5">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
</div>

<div *ngIf="error()" class="alert alert-danger text-center m-5">
  <h3>Oops! We couldn't find this product.</h3>
  <a routerLink="/products" class="btn btn-primary mt-3">Back to Products</a>
</div>
