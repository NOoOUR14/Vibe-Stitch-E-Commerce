<div class="container my-5 pt-5">
  <h2 class="fw-bold mb-4">My Orders History</h2>

  <div *ngIf="orders().length === 0" class="alert alert-info">
    You haven't placed any orders yet.
  </div>

  <div class="row">
    <div class="col-12 mb-4" *ngFor="let order of orders()">
      <div class="card shadow-sm border-0 p-3">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <h6 class="text-muted mb-1 small">Order ID: {{ order._id }}</h6>
            <h5 class="fw-bold mb-0">Total: {{ order.totalPrice | currency }}</h5>
            <span class="badge" [ngClass]="{
              'bg-warning': order.status === 'Pending',
              'bg-success': order.status === 'Delivered',
              'bg-primary': order.status === 'Shipped'
            }">{{ order.status }}</span>
          </div>
          <div class="text-end">
            <p class="small text-muted mb-0">{{ order.createdAt | date:'medium' }}</p>
            <p class="small mb-0">Items: {{ order.orderItems.length }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
