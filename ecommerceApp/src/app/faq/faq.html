<div class="faq-container container my-5 py-5">
  <div class="text-center mb-5">
    <h2 class="fw-bold text-uppercase" style="letter-spacing: 3px;">Frequently Asked Questions</h2>
    <p class="text-muted">Everything you need to know about Vibe & Stitch</p>
  </div>

  <div class="accordion accordion-flush mx-auto" id="vsFaqAccordion" style="max-width: 800px;">

    <div class="accordion-item bg-transparent border-bottom border-secondary py-3" *ngFor="let item of faqs(); let i = index">
      <h2 class="accordion-header">
        <button class="accordion-button collapsed bg-transparent text-white fw-bold shadow-none"
                type="button"
                data-bs-toggle="collapse"
                [attr.data-bs-target]="'#faq' + i">
          {{ i + 1 }}. {{ item.question }}
        </button>
      </h2>
      <div [id]="'faq' + i" class="accordion-collapse collapse" data-bs-parent="#vsFaqAccordion">
        <div class="accordion-body text-secondary-emphasis">
          {{ item.answer }}
        </div>
      </div>
    </div>

    <div *ngIf="faqs().length === 0" class="text-center text-secondary">
      <p>No questions available at the moment.</p>
    </div>

  </div>
</div>
