        <li class="nav-item">
          <a class="nav-link px-3" routerLink="/products" [queryParams]="{ filter: 'all' }" routerLinkActive="active">All Collection</a>
        </li>

        <li class="nav-item">
          <a class="nav-link px-3" routerLink="/products" [queryParams]="{ gender: 'men' }" routerLinkActive="active">Men's Wear</a>
        </li>

        <li class="nav-item">
          <a class="nav-link px-3" routerLink="/products" [queryParams]="{ gender: 'women' }" routerLinkActive="active">Women's Wear</a>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle px-3" href="#" id="catDrop" data-bs-toggle="dropdown">Categories</a>
          <ul class="dropdown-menu dropdown-menu-dark bg-black border-secondary">
            <li><a class="dropdown-item small" routerLink="/products" [queryParams]="{ category: 't-shirts' }">T-Shirts</a></li>
            <li><a class="dropdown-item small" routerLink="/products" [queryParams]="{ category: 'hoodies' }">Hoodies</a></li>
            <li><a class="dropdown-item small" routerLink="/products" [queryParams]="{ category: 'pants' }">Pants</a></li>
          </ul>
        </li>

        <li class="nav-item">
          <a class="nav-link px-3 text-white" routerLink="/products/new-arrivals" routerLinkActive="active">New Arrivals</a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-3">
        <div class="position-relative">

        </div>

  </span>

          <ng-container *ngIf="!authService.isLoggedIn()">

            <a routerLink="/register" class="btn btn-outline-light btn-sm fw-bold">REGISTER</a>
          </ng-container>
          <ng-container *ngIf="authService.isLoggedIn()">
            <button (click)="logout()" class="btn btn-sm btn-danger fw-bold">LOGOUT</button>
