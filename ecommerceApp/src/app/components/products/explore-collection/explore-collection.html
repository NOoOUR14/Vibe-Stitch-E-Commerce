<section class="products-section py-5">
  <div class="container">

    <div class="section-title mb-4">
      <h2 class="fw-bold text-uppercase">Explore Collection</h2>
      <div class="title-line"></div>
    </div>

    <div class="row g-4" *ngIf="allProducts && allProducts.length > 0; else loadingOrEmpty">

      <div class="col-xl-3 col-lg-4 col-md-6 col-sm-12" *ngFor="let item of allProducts">

        <app-product-card [product]="item"></app-product-card>

      </div>

    </div>

    <ng-template #loadingOrEmpty>
      <div class="text-center py-5">
        <div class="spinner-border text-primary mb-3" role="status" *ngIf="allProducts === null">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="text-muted fs-5">No products available in this category yet.</p>
      </div>
    </ng-template>

  </div>
</section>
