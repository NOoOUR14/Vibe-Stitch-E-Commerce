<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh; pt-5">
  <div class="card shadow-sm border-0 p-4" style="width: 100%; max-width: 400px;">
    <h2 class="fw-bold mb-4 text-center">Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="mb-3">
        <label class="form-label fw-medium">Email Address</label>
        <input type="email" formControlName="email" class="form-control" placeholder="name@example.com">
      </div>

      <div class="mb-4">
        <label class="form-label fw-medium">Password</label>
        <input type="password" formControlName="password" class="form-control" placeholder="******">
      </div>

      <button type="submit" [disabled]="loginForm.invalid" class="btn btn-dark w-100 py-2 fw-bold shadow-sm">
        LOGIN
      </button>

      <p class="text-center mt-3 small">
        Don't have an account? <a routerLink="/register" class="text-decoration-none fw-bold text-dark">Register</a>
      </p>
    </form>
  </div>
</div>
