<div class="container mt-5 pt-5">
  <h2 class="fw-bold mb-4">Pending Reviews</h2>
  <div class="table-responsive">
    <table class="table table-hover border">
      <thead class="table-dark">
        <tr>
          <th>User</th>
          <th>Comment</th>
          <th>Rating</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let review of pendingReviews()">
          <td>{{ review.userId?.name || 'Anonymous'}}</td>
          <td>{{ review.review }}</td>
          <td>{{ review.rating }} </td>
          <td>
            <button class="btn btn-success btn-sm me-2" (click)="approveReview(review._id)">Approve</button>
            <button class="btn btn-danger btn-sm" (click)="deleteReview(review._id)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
